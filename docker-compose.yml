services:

  # App — code baked into image, no source bind mounts
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tailor-on-desk-app
    container_name: tailor-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tailor-network

  # Queue Worker
  worker:
    image: tailor-on-desk-app
    container_name: tailor-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    depends_on:
      - app
    networks:
      - tailor-network

  # PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: tailor-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tailor_on_desk}
      POSTGRES_USER: ${DB_USERNAME:-tailor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - tailor-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tailor} -d ${DB_DATABASE:-tailor_on_desk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tailor-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: tailor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tailor-network

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: tailor-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - tailor-network

networks:
  tailor-network:
    driver: bridge

volumes:
  tailor-db-data:
    driver: local
